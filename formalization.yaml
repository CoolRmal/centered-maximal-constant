# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: A lower bound 1.6855 for the planar centred Hardy-Littlewood maximal constant over squares
  description: |-
    Let c_d be the weak type (1,1) constant of the centred Hardy-Littlewood maximal operator over axis-parallel cubes in R^d: the least C such that alpha |{Mf > alpha}| <= C ||f||_1 for every integrable f and every level alpha. Its value is unknown for every d >= 2; in the plane the previously published lower bound is c_2 >= 3/4 - sqrt(2)/4 + sqrt(6)/2 = 1.62119... (Aldaz 2000) and the best known upper bound is 4.
    This development proves c_2 >= Phi = 1.68550999335552518..., an explicit algebraic number of degree 16, from a lattice with unequal masses: columns at spacing h = (5 + sqrt 22)/6 carrying masses alternating 1 and w = (17 + 4 sqrt 22)/9, rows at spacing h + 1. It also proves the classical covering bound c_d <= 2^d in every dimension and 1.685 < Phi < 1.686.
  authors:
  - Yongxi Lin
  license: Apache-2.0
  responsible_maintainers:
  - Yongxi Lin
classification:
  arxiv:
  - math.CA
  - math.FA
  msc2020:
  - 42B25
  - 26D15
sources:
- title: |-
    The lower bound c_2 >= 1.68550999... for the weak type (1,1) constant of the centred Hardy-Littlewood maximal operator over squares, from a lattice with alternating masses 1 and (17 + 4 sqrt 22)/9
  type: original-proof
  relationship: other
  note: |-
    The principal result is first presented in this repository (docs/PROOF.md, docs/HISTORY.md). Novelty: a literature search on 2026-09-18 covered arXiv (about 15 API queries), the works citing Aldaz (2000) and Melas (2003) in Semantic Scholar, the full history of the compilation page for constant 47a with its issues, pull requests and forks, a GitHub-wide code search, Zenodo, Hugging Face, Figshare, the Palomar registry, Epoch's FrontierMath open problems, erdosproblems.com, MathOverflow and google-deepmind/formal-conjectures, with exact-number searches for 1.6211914, 1.668558, 1.6855 and 3(2+sqrt6)/8. No lower bound above 1.6212 for centred squares in the plane was found; the most recent AI-driven work on the centred constant (arXiv:2511.02864, arXiv:2608.23691) treats dimension one only. Not reached: OpenAlex (rate-limited), zbMATH's cited-by pages (HTTP 403) and paywalled full texts. Novelty is asserted on this basis alone.
- title: A remark on the centered n-dimensional Hardy-Littlewood maximal function
  authors:
  - J. M. Aldaz
  id: Czechoslovak Math. J. 50 (2000), no. 1, 103-112
  type: paper
  location: https://dml.cz/bitstream/handle/10338.dmlcz/127554/CzechMathJ_50-2000-1_14.pdf
  relationship: other
  note: |-
    Relationship other: Proposition 1.4 with n = 2 gives the previous record 1.62119... from a rectangular lattice of unit masses, and Lemma 1.1 is the device turning a lattice of point masses into integrable test functions. The development re-proves that device for weighted atoms (CenteredMaximal/Lattice/Smear.lean) and improves the bound; no statement is transcribed.
  license: unknown
  author_endorsement: not-contacted
- title: Improving the planar centered maximal constant (research brief)
  type: other
  relationship: other
  note: |-
    Relationship other: an unpublished brief dated 2026-09-18, supplied by the maintainer, which recalled Aldaz's bound, proved the seed c_2 >= 3(2 + sqrt6)/8 from a unit lattice (no novelty claimed for it), and suggested weighted periodic motifs. The weighted configuration, Phi and the proof here are not in the brief, which is not included in the repository.
- title: '245A, Notes 5: Differentiation theorems (Exercise 42)'
  authors:
  - Terence Tao
  type: web discussion
  location: https://terrytao.wordpress.com/2010/10/16/245a-notes-5-differentiation-theorems/
  relationship: other
  note: |-
    Relationship other: the upper bound c_d <= 2^d (CenteredMaximal.weakTypeConstant_le_two_pow) is Exercise 42 of these notes, a known result formalized inside a submission whose principal result is original. The proof uses Mathlib's Vitali lemma with enlargement tau > 1 and lets tau tend to 1.
  license: unknown
  author_endorsement: not-contacted
- title: The best constant for the centered Hardy-Littlewood maximal inequality
  authors:
  - A. D. Melas
  id: Ann. of Math. (2) 157 (2003), 647-688
  type: paper
  relationship: background
  note: Determines c_1 = (11 + sqrt61)/12 exactly; with c_{d+1} >= c_d this gives c_2 >= 1.5675. Context only.
  license: unknown
  author_endorsement: not-contacted
- title: Weak type (1, 1) inequalities of maximal convolution operators
  authors:
  - M. Trinidad Menarguez
  - F. Soria
  id: Rend. Circ. Mat. Palermo (2) 41 (1992), 342-352, doi:10.1007/BF02848939
  type: paper
  relationship: background
  note: Earlier lattice lower bound c_n >= ((1 + 2^(1/n))/2)^n, about 1.4571 for n = 2. Context only; content taken from Aldaz 2000.
  license: unknown
  author_endorsement: not-contacted
- title: Some remarks on dimension-free estimates for the discrete Hardy-Littlewood maximal functions
  authors:
  - D. Kosz
  - M. Mirek
  - P. Plewa
  - B. Wrobel
  id: arXiv:2010.07379
  type: paper
  location: https://arxiv.org/abs/2010.07379
  relationship: background
  note: Shows that the best weak type (1,1) constant over cubes on R^d equals its discrete analogue on Z^d, which supports searching among lattices of point masses. Context only.
  license: unknown
  author_endorsement: not-contacted
- title: Centered Hardy-Littlewood maximal constant in dimension 2 (constant 47a)
  type: other
  location: https://teorth.github.io/optimizationproblems/constants/47a.html
  relationship: background
  note: Public compilation of optimization constants; consulted 2026-09-18, when it listed 1.6211915 as the best lower bound and 4 as the best upper bound.
related_formalizations:
- id: https://github.com/fpvandoorn/carleson
  relationship: independent
  note: Formalizes an uncentred maximal function on doubling metric measure spaces with a non-sharp weak type bound. Not used here.
- id: https://github.com/TauCetiProject/TauCeti
  relationship: independent
  note: Contains a centred maximal function over balls with the weak type bound 4^n. Not used here; the challenge imports only Mathlib.
status:
  scope: |-
    Formalized in full, using only propext, Classical.choice and Quot.sound: c_2 >= Phi (CenteredMaximal.ofReal_phi_le_weakTypeConstant_two), c_d <= 2^d for every d including d = 0 (CenteredMaximal.weakTypeConstant_le_two_pow), and 1.685 < Phi < 1.686 (CenteredMaximal.lt_phi, CenteredMaximal.phi_lt). The definitions live in Challenge.lean with Mathlib imports only; cubes are Metric.closedBall in Fin d -> R with its sup norm, the maximal function takes values in [0, infinity], and level sets are measured with Lebesgue outer measure.
    Not formalized: the exact area 2hV - 4ab of the level-one set (only the lower bound is needed); any optimality of Phi (none is claimed); the restricted optimality of the seed lattice certified during the exploration; sharpness of 2^d.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - claude-fable-5-1
    framework: Claude Code
    tool_setup: |-
      Discovery and certification, before any Lean was written: exact and floating-point evaluators of the level-one area for weighted periodic product measures (Python, C++), Nelder-Mead searches over seventeen weighted product families and several non-product motifs, identification of the exact parameters from three edge collisions, an exact rational certificate, and six independent referee agents attacking it. These exploratory programs are not in this repository. The same session ran the literature search recorded under sources.
    cost:
      wall_time: one working day (2026-09-18)
      spend_usd: subscription-based
      hardware: local machine for computation, API-only for inference
    prompting_notes: Human-directed; the maintainer supplied the research brief and asked for a certified improvement, then for a literature review and the formalization.
  - method: agent
    models:
    - claude-opus-5
    framework: Claude Code with the mathlib-quality plugin
    tool_setup: |-
      The Lean 4 development was written against Mathlib from a plan written first (.mathlib-quality/), then a skeleton with every lemma stated, then the proofs file by file, then a mathlib-quality cleanup pass with one worker per substantive declaration. The Lean proof simplifies the exploratory certificate (six witnesses on a quarter cell instead of twelve on the full cell, and only a lower bound for the covered area).
    cost:
      wall_time: part of the same working day
      spend_usd: subscription-based
      hardware: local machine for Lean builds, API-only for inference
    prompting_notes: Goal-directed with human instructions on scope, statements and the comparator and Palomar standards.
  - method: manual
    models: []
    framework: n/a
    tool_setup: Human direction and judgement; the research brief, the choice of targets and statements, and the decision to formalize.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: local machine
    prompting_notes: n/a
  spend_usd: subscription-based; not separately tracked
  notes: |-
    The mathematics and the Lean formalization were produced by AI agents under the maintainer's direction, in two stages with an explicit handover summarised in docs/HISTORY.md. No AI system is listed as an author.
fidelity:
  divergences: |-
    No cited source result is formalized for the principal theorem, which is stated here for the first time. The upper bound follows Tao's Exercise 42 except that Mathlib's Vitali lemma needs an enlargement tau > 1, so the proof gives (1 + tau)^d for each tau > 1 and passes to the limit. The smearing of point masses follows Aldaz's Lemma 1.1, adapted to atoms of unequal mass.
review:
  status: agent-reviewed
  reviewers:
  - six independent AI referee agents (Claude Code), for the exploratory certificate; no human review
  notes: |-
    No external human review. The exploratory certificate was attacked by six independent referee agents and all concluded that the claim holds. The Lean statement was checked by reading Challenge.lean against the informal definitions; the compared theorems' axioms were printed and are exactly propext, Classical.choice and Quot.sound.
alignment:
  namespace: CenteredMaximal
  statements:
  - source: 'Original result: c_2 >= Phi = 1.68550999... for the centred maximal operator over squares'
    lean: CenteredMaximal.ofReal_phi_le_weakTypeConstant_two
    module: Solution
    status: proved
    note: Compared declaration; the principal result.
  - source: 'Classical upper bound (Tao, 245A Notes 5, Exercise 42): c_d <= 2^d in every dimension'
    lean: CenteredMaximal.weakTypeConstant_le_two_pow
    module: Solution
    status: proved
    note: Compared declaration; shows the constant is finite.
  - source: 'Numerical value: 1.685 < Phi'
    lean: CenteredMaximal.lt_phi
    module: Solution
    status: proved
    note: Compared declaration.
  - source: 'Numerical value: Phi < 1.686'
    lean: CenteredMaximal.phi_lt
    module: Solution
    status: proved
    note: Compared declaration.
  - source: 'Phi is the covered area per unit mass: Phi = (2hV - 4ab)/(1 + w)'
    lean: CenteredMaximal.Lattice.phi_eq
    module: CenteredMaximal.Lattice.Constants
    status: proved
    note: Links the closed form in the challenge to the construction.
  - source: 'Every weak type bound in dimension two is at least Phi'
    lean: CenteredMaximal.Lattice.ofReal_phi_le
    module: CenteredMaximal.Lattice.LowerBound
    status: proved
