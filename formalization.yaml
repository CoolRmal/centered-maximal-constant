acknowledgements: |-
  Built on Lean 4 and Mathlib, and checked with Lean Comparator. The lattice approach to lower bounds for c_d goes back to Trinidad Menarguez and Soria and to Aldaz; the covering argument for the upper bound is classical. The search, certificate and formalization were carried out with Claude Code; no AI system is listed as an author, in line with Palomar's human-authorship requirement.
