<text x="32" y="608.88" fill="#64748b" font-size="14">A point is covered when the closed square of that side centred at it contains those atoms; their total mass is exactly side², so the square has</text>
<text x="32" y="628.88" fill="#64748b" font-size="14">average 1 and M<tspan font-style="italic">μ</tspan> ≥ 1 there. Coloured: the proof certifies M<tspan font-style="italic">μ</tspan> ≥ 1. Red: the four slots it leaves out. Names follow isWitness_… in Witness.lean.</text>
